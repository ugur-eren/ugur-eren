name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=transparent&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR&show_icons=true&show=prs_reviewed,issues_commented&hide=contribs&include_all_commits=true&rank_icon=github
          path: images/stats.svg
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        env:
          FETCH_MULTI_PAGE_STARS: true

      - name: Commit cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add images/stats.svg
          git commit -m "Update README cards" || exit 0
          git push
